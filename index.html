<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Gym | Premier Fitness & Strength Club</title>
    <meta
      name="description"
      content="Unleash your strength at Demo Gym. World-class strength training, cardio arena, CrossFit turf, and flexible membership plans."
    />
    <meta property="og:title" content="Demo Gym | Premier Fitness & Strength Club" />
    <meta
      property="og:description"
      content="Unleash your strength at Demo Gym. World-class strength training, cardio arena, CrossFit turf, and flexible membership plans."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Demo Gym" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Demo Gym | Premier Fitness & Strength Club" />
    <meta
      name="twitter:description"
      content="Unleash your strength at Demo Gym. World-class strength training, cardio arena, CrossFit turf, and flexible membership plans."
    />
    <meta name="theme-color" content="#0d0d0e" />

    <!-- Google Fonts: Barlow Condensed for athletic display + Plus Jakarta Sans for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org JSON-LD structured data for Gym / HealthClub -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HealthClub",
        "name": "Demo Gym",
        "description": "Premier strength, bodybuilding, CrossFit, and functional fitness club.",
        "telephone": "+91 9XXXXXXXXX",
        "email": "contact@demogym.com",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "05:30",
            "closes": "22:30"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Sunday",
            "opens": "06:00",
            "closes": "20:00"
          }
        ],
        "priceRange": "₹₹"
      }
    </script>
  </head>
  <body class="bg-[#090A0C] text-neutral-100 antialiased selection:bg-[#FF4D00] selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
